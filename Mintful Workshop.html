<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mintful — MoneySense Workshop</title>
<link href="https://fonts.cdnfonts.com/css/garet" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --tier:#E8391B; --tier-dark:#c53317; --tier-light:#FEF3F0; --tier-mid:#f9a090;
    --text-main:#1A1A1A; --text-muted:#6B6B6B; --text-light:#9A9A9A;
    --border:#E8E4DF; --success:#059669; --error:#dc2626;
    --accent:#E8391B;
    --font:'Garet',system-ui,sans-serif; --font-body:'DM Sans','Garet',system-ui,sans-serif;
    --mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);font-size:15px;background:#F8F7F4;color:var(--text-main);display:flex;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;}

/* ── Sidebar ── */
.sidebar{width:260px;background:#fff;border-right:1px solid #e5e5e5;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;padding-bottom:40px;}
.sidebar-top{padding:28px 24px 20px;border-bottom:1px solid #f0f0f0;}
.logo{font-family:var(--font);font-size:22px;font-weight:800;color:#0a0a0a;display:flex;align-items:center;gap:8px;letter-spacing:-0.5px;margin-bottom:4px;}
.logo span{background:linear-gradient(112deg,#E8391B 0%,#f05a30 45%,#f5856a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-sub{font-size:9px;color:#a3a3a3;letter-spacing:2px;text-transform:uppercase;font-weight:500;}
.nav-section{padding:16px 12px;flex:1;overflow-y:auto;}
.nav-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#c4c4c4;padding:0 10px;margin-bottom:8px;}
.nav-item{padding:10px 12px;margin-bottom:2px;border-radius:8px;cursor:pointer;transition:all .25s cubic-bezier(.25,.46,.45,.94);display:flex;align-items:center;gap:10px;border:1px solid transparent;}
.nav-item:hover{background:#f5f5f5;}
.nav-item.active{background:#FEF3F0;border-color:rgba(232,57,27,.12);}
.nav-icon{width:30px;height:30px;border-radius:6px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-muted);}
.nav-item.active .nav-icon{background:#FEF3F0;color:#E8391B;}
.nav-text{flex:1;}
.nav-title{font-size:12px;font-weight:600;color:#525252;display:block;line-height:1.2;}
.nav-item.active .nav-title{color:#E8391B;}
.nav-sub{font-size:10px;color:#c4c4c4;margin-top:1px;display:block;}
.nav-badge{display:none;}
.nav-done{margin-left:auto;width:18px;height:18px;border-radius:50%;background:var(--tier);display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;flex-shrink:0;}
.sidebar-footer{padding:14px 20px;border-top:1px solid #f0f0f0;font-size:11px;color:#d4d4d4;display:flex;align-items:center;gap:6px;}

/* ── Main ── */
.main-content{flex:1;overflow-y:auto;display:flex;flex-direction:column;background:#F8F7F4;padding-bottom:40px;}

/* ── Dashboard ── */
#dashboard-view{padding:52px 56px;flex:1;animation:fadeUp .4s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.dash-header{max-width:860px;margin-bottom:44px;}
.dash-eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#1A1A1A;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.dash-eyebrow::before{content:'';display:inline-block;width:24px;height:2px;background:var(--accent);border-radius:0;}
.dash-header h1{font-family:var(--font);font-size:3rem;font-weight:800;line-height:1.05;background:linear-gradient(112deg,#E8391B 0%,#f05a30 45%,#f5856a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-2px;margin-bottom:14px;padding-bottom:6px;}
.dash-header p{font-size:1rem;color:#737373;line-height:1.7;max-width:500px;font-weight:400;}
.review-note{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:7px 14px;background:#f8fafc;border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--text-muted);}
.review-note a{color:var(--tier);text-decoration:none;font-weight:600;}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;max-width:1060px;}

/* ── Cards ── */
.lesson-card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .3s cubic-bezier(.25,.46,.45,.94),box-shadow .3s ease,border-color .3s ease;display:flex;flex-direction:column;}
.lesson-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.06);border-color:#ccc;}
.lesson-card.done{border-color:var(--tier)!important;background:var(--tier-light);}
.lc-banner{display:none;}
.lc-body{padding:20px 22px 16px;flex:1;display:flex;flex-direction:column;}
.lc-num{display:none;}
.lc-title{font-family:var(--font);font-size:1.12rem;font-weight:700;background:linear-gradient(112deg,#E8391B 0%,#f05a30 45%,#f5856a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;letter-spacing:-.4px;line-height:1.25;}
.lc-sub{font-size:.82rem;font-weight:500;color:#6B6B6B;margin-bottom:10px;font-style:italic;}
.lc-desc{font-size:.875rem;color:var(--text-muted);line-height:1.55;flex:1;font-weight:300;}
.lc-footer{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.lc-tags{display:flex;gap:8px;flex-wrap:wrap;}
.lc-tag{font-size:10px;padding:3px 9px;border-radius:20px;background:#f3f2ef;color:#6B6B6B;font-weight:600;}
.lc-action{font-family:var(--font);font-size:12px;font-weight:700;color:#E8391B;display:flex;align-items:center;gap:4px;transition:gap .2s;white-space:nowrap;}
.lesson-card:hover .lc-action{gap:8px;}
.lc-done-badge{font-size:10px;font-weight:700;color:var(--tier);background:var(--tier-light);padding:3px 9px;border-radius:20px;}

/* ── Reader ── */
.reader-wrap{display:none;flex:1;flex-direction:column;animation:fadeUp .35s ease;}
.reader-topbar{padding:14px 28px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:10;}
.exit-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 16px;font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .2s;}
.exit-btn:hover{background:#f8fafc;color:var(--text-main);}
.lesson-breadcrumb{font-size:12px;color:var(--text-light);flex:1;}
.lesson-breadcrumb strong{color:var(--text-main);}
.progress-info{display:flex;align-items:center;gap:12px;}
.progress-counter{font-family:var(--mono);font-size:11px;color:var(--text-light);}
.progress-track{width:140px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--tier);border-radius:2px;width:0%;transition:width .35s ease;}
.reader-body{flex:1;overflow:hidden;display:flex;}
.reader-content-area{flex:1;overflow-y:auto;padding:60px 80px 80px;max-width:780px;margin:0 auto;width:100%;background:#fff;}

/* ── Content typography ── */
.page-eyebrow{display:none;}
.reader-content-area h2{font-family:var(--font);font-size:2.5rem;font-weight:800;line-height:1.08;background:linear-gradient(112deg,#E8391B 0%,#f05a30 45%,#f5856a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-2px;margin-bottom:24px;}
.reader-content-area h3{font-family:var(--font);font-size:1.2rem;font-weight:700;color:#0a0a0a;margin:40px 0 12px;letter-spacing:-.3px;}
.reader-content-area p{font-size:1rem;line-height:1.8;color:#404040;margin-bottom:18px;font-weight:400;}
.reader-content-area ul,.reader-content-area ol{padding-left:20px;margin-bottom:16px;}
.reader-content-area li{font-size:1rem;line-height:1.8;color:#404040;margin-bottom:8px;font-weight:400;}
.key-term{background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(232,57,27,.1),0 2px 6px rgba(232,57,27,.06);padding:18px 24px;margin:28px 0;}
.key-term .kt-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--tier);font-weight:700;margin-bottom:6px;display:block;}
.key-term .kt-term{font-family:var(--font);font-size:1.1rem;font-weight:700;color:#0a0a0a;margin-bottom:8px;display:block;letter-spacing:-.3px;}
.key-term p{font-size:.94rem;color:#404040;margin-bottom:0!important;}
.example-box{background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(232,57,27,.1),0 2px 6px rgba(232,57,27,.06);padding:18px 24px;margin:26px 0;}
.example-box .ex-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#d97706;font-weight:700;margin-bottom:8px;display:block;}
.example-box p{font-size:.94rem;color:#404040;margin-bottom:0!important;}
.callout{background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(232,57,27,.1),0 2px 6px rgba(232,57,27,.06);padding:16px 22px;margin:26px 0;display:flex;gap:14px;align-items:flex-start;}
.callout-icon{font-size:18px;flex-shrink:0;margin-top:2px;}
.callout p{margin-bottom:0!important;color:#404040;font-size:.94rem;}
.warning-box{background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(232,57,27,.1),0 2px 6px rgba(232,57,27,.06);padding:16px 22px;margin:26px 0;}
.warning-box .wl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--tier);font-weight:700;margin-bottom:6px;display:block;}
.warning-box p{color:#404040;margin-bottom:0!important;font-size:.94rem;}
.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin:26px 0;}
.stat-card{background:#fff;border:1px solid #e8ecf0;border-radius:10px;padding:20px 18px;text-align:center;}
.stat-num{font-family:var(--font);font-size:2rem;font-weight:700;color:#0a0a0a;display:block;letter-spacing:-.8px;}
.stat-label{font-size:11px;color:#737373;margin-top:5px;}

/* ── Comparison table ── */
.comp-table{width:100%;border-collapse:collapse;margin:26px 0;font-size:.93rem;}
.comp-table th{text-align:left;padding:12px 14px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;border-bottom:2px solid #e5e5e5;font-family:var(--font);}
.comp-table th:first-child{color:#94a3b8;}
.comp-table .h-hdb{color:#2563EB;}
.comp-table .h-bank{color:#d97706;}
.comp-table td{padding:13px 14px;border-bottom:1px solid #f1f5f9;color:#374151;vertical-align:top;line-height:1.5;}
.comp-table td:first-child{font-weight:600;color:#0f172a;font-size:.88rem;}
.comp-table tr:last-child td{border-bottom:none;}
.comp-table tr:hover td{background:#fafafa;}
.val-hdb{color:#2563EB;font-weight:600;}
.val-bank{color:#d97706;font-weight:600;}
.val-warn{color:#dc2626;font-weight:600;}

/* ── Mortgage visual ── */
.mortgage-visual{background:#fff;border-radius:12px;border:1px solid #e8ecf0;overflow:hidden;margin:20px 0;}
.mv-header{background:#0f172a;padding:16px 22px;color:#fff;}
.mv-header h3{font-family:var(--font);font-weight:700;font-size:13px;margin:0 0 3px;}
.mv-header p{font-size:10px;color:rgba(255,255,255,.45);margin:0;}
.mv-stats{display:grid;grid-template-columns:repeat(3,1fr);}
.mv-stat{padding:16px 18px;border-right:1px solid #e5e5e5;text-align:center;}
.mv-stat:last-child{border-right:none;}
.mv-stat-val{font-family:var(--font);font-size:1.5rem;font-weight:700;color:var(--tier);letter-spacing:-.5px;}
.mv-stat-label{font-size:10px;color:var(--text-muted);margin-top:3px;}
.mv-amort{padding:18px 22px;}
.mv-amort-title{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px;font-weight:600;}
.mv-year-row{display:grid;grid-template-columns:50px 1fr 80px;gap:10px;align-items:center;margin-bottom:8px;}
.mv-year-label{font-size:11px;color:var(--text-muted);font-family:var(--mono);}
.mv-bar-stack{height:13px;border-radius:6px;overflow:hidden;display:flex;background:#e5e5e5;}
.mv-interest-bar{background:#fca5a5;height:100%;}
.mv-capital-bar{background:#93c5fd;height:100%;}
.mv-year-amt{font-size:11px;color:var(--text-muted);font-family:var(--mono);text-align:right;}
.mv-legend{display:flex;gap:16px;padding:0 22px 16px;}
.mv-legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);}
.mv-legend-dot{width:10px;height:10px;border-radius:3px;}

/* ── Credit card statement ── */
.cc-statement{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e8ecf0;margin:20px 0;font-family:var(--mono);}
.cc-header{background:#1e293b;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:flex-start;}
.cc-bank{font-size:16px;font-weight:700;letter-spacing:2px;}
.cc-type{font-size:10px;color:rgba(255,255,255,.4);margin-top:3px;}
.cc-number{font-size:13px;color:rgba(255,255,255,.55);letter-spacing:4px;}
.cc-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);}
.cc-sum-cell{background:#f8fafc;padding:14px 18px;}
.cc-sum-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px;}
.cc-sum-val{font-size:1.1rem;font-weight:700;color:var(--text-main);}
.cc-sum-val.red{color:#dc2626;}
.cc-sum-val.amber{color:#d97706;}
.cc-tx-header{padding:12px 24px 8px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);display:grid;grid-template-columns:1fr auto auto;gap:16px;border-bottom:1px solid var(--border);}
.cc-tx-row{padding:11px 24px;display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;border-bottom:1px solid #f1f5f9;}
.cc-tx-row:last-child{border-bottom:none;}
.cc-tx-name{font-size:13px;color:var(--text-main);font-family:var(--font);}
.cc-tx-date{font-size:11px;color:var(--text-muted);}
.cc-tx-amt{font-size:13px;font-weight:600;text-align:right;}
.cc-tx-amt.debit{color:#dc2626;}
.cc-tx-amt.credit{color:#059669;}
.cc-interest-box{margin:12px 18px;background:#fff1f2;border:1px solid #fecdd3;border-radius:10px;padding:14px 18px;}
.cc-interest-title{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#9f1239;font-weight:700;margin-bottom:6px;font-family:var(--font);}
.cc-interest-row{display:flex;justify-content:space-between;font-size:12px;color:#be123c;margin-bottom:4px;}
.cc-min-warn{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;margin:10px 18px 14px;}
.cc-min-warn-title{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#92400e;font-weight:700;margin-bottom:4px;font-family:var(--font);}
.cc-min-warn-text{font-size:12px;color:#78350f;font-family:var(--font);}

/* ── Quiz ── */
.quiz-wrap{padding-top:16px;}
.quiz-step{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--tier);font-weight:700;margin-bottom:18px;}
.quiz-q{font-family:var(--font);font-size:1.55rem;font-weight:600;color:var(--text-main);margin-bottom:28px;line-height:1.3;letter-spacing:-.4px;}
.options-grid{display:flex;flex-direction:column;gap:10px;}
.option-btn{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid #e5e5e5;border-radius:8px;background:#fff;cursor:pointer;transition:all .2s;text-align:left;width:100%;}
.option-letter{width:28px;height:28px;border-radius:6px;background:#f1f5f9;color:#737373;font-family:var(--mono);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.option-text{font-size:.97rem;color:var(--text-main);font-weight:400;line-height:1.4;}
.option-btn:hover:not(:disabled){border-color:var(--tier-mid);background:var(--tier-light);}
.option-btn:hover:not(:disabled) .option-letter{background:var(--tier);color:#fff;}
.option-btn.correct{border-color:var(--success);background:#f0fdf4;}
.option-btn.correct .option-letter{background:var(--success);color:#fff;}
.option-btn.wrong{border-color:var(--error);background:#fff1f2;}
.option-btn.wrong .option-letter{background:var(--error);color:#fff;}
.feedback-panel{margin-top:20px;padding:18px 22px;border-radius:12px;animation:fadeUp .3s ease;display:none;}
.feedback-panel.correct-fb{background:#f0fdf4;border:1px solid #bbf7d0;}
.feedback-panel.wrong-fb{background:#fff1f2;border:1px solid #fecdd3;}
.feedback-head{font-weight:700;font-size:.97rem;margin-bottom:5px;}
.feedback-panel.correct-fb .feedback-head{color:var(--success);}
.feedback-panel.wrong-fb .feedback-head{color:var(--error);}
.feedback-body{font-size:.9rem;color:#475569;line-height:1.5;}

/* ── Reader footer ── */
.reader-footer{padding:18px 76px;background:#fff;border-top:1px solid #e5e5e5;display:flex;justify-content:flex-end;position:sticky;bottom:0;}
.btn-next{background:var(--tier);color:#fff;border:none;padding:13px 34px;border-radius:10px;font-family:var(--font-body);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:7px;}
.btn-next:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px);}
.btn-next:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* ── Completion ── */
.completion-screen{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:60px;animation:fadeUp .4s ease;}
.completion-icon{margin-bottom:22px;animation:pop .4s ease .1s both;}
.completion-icon svg{stroke:var(--tier);}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.completion-screen h2{font-family:var(--font);font-size:2rem;font-weight:700;letter-spacing:-.4px;margin-bottom:10px;}
.completion-screen p{font-size:1.05rem;color:var(--text-muted);max-width:380px;line-height:1.6;margin-bottom:30px;}
.btn-home{background:var(--tier);color:#fff;border:none;padding:15px 38px;border-radius:12px;font-family:var(--font-body);font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;}
.btn-home:hover{filter:brightness(1.1);transform:translateY(-2px);}

/* ── Activity ── */
.activity-wrap{padding-top:8px;}
.activity-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--tier);font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:8px;}

/* ── Mobile ── */
.mobile-topbar{display:none;align-items:center;justify-content:space-between;padding:14px 20px;background:#fff;border-bottom:1px solid #e5e5e5;position:sticky;top:0;z-index:20;}
.mobile-logo{font-family:var(--font);font-weight:700;font-size:17px;color:#0f172a;}
.ham-btn{background:rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.1);border-radius:8px;padding:8px;cursor:pointer;color:#334155;display:flex;align-items:center;}
@media(max-width:600px){
    body{overflow:auto;height:auto;flex-direction:column;}
    .sidebar{display:none;width:100%;}
    .sidebar.open{display:flex;position:fixed;inset:0;z-index:100;overflow-y:auto;height:auto;}
    .mobile-topbar{display:flex;}
    #dashboard-view{padding:24px 20px;}
    .lesson-grid{grid-template-columns:1fr;}
    .reader-content-area{padding:28px 20px 80px;}
    .reader-footer{padding:14px 20px;}
    .reader-topbar{padding:12px 14px;gap:10px;}
    .progress-track{width:80px;}
    .mv-stats{grid-template-columns:1fr;}
    .cc-summary{grid-template-columns:1fr;}
    .comp-table td,.comp-table th{padding:10px 10px;font-size:.82rem;}
    .ham-reader{display:flex!important;}
}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-top">
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">
                <defs>
                    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#E8391B"/>
                        <stop offset="50%" stop-color="#f05a30"/>
                        <stop offset="100%" stop-color="#f5856a"/>
                    </linearGradient>
                </defs>
                <path d="M12 22s8-4 8-10a8 8 0 0 0-8-8 8 8 0 0 0-8 8c0 6 8 10 8 10z" fill="url(#logoGrad)" stroke="none"/>
                <line x1="12" y1="22" x2="12" y2="12" stroke="rgba(255,255,255,0.65)" stroke-width="1.5"/>
            </svg>
            <span>Mintful</span>

pages:[
{ type:'text', content:`
<div class="page-eyebrow">Unit 1 · Lesson 1</div>
<h2>What Is the CBS Credit Score?</h2>
<p>In Singapore, the <strong>Credit Bureau Singapore (CBS)</strong> maintains a record of every credit facility you have ever held — credit cards, personal loans, car loans, mortgages, and more. Every time you apply for credit, banks pull your CBS report to assess risk.</p>
<div class="key-term">
    <span class="kt-label">Key Term</span>
    <span class="kt-term">CBS Credit Score</span>
    <p>A numerical score between <strong>1000 (highest risk) and 2000 (lowest risk)</strong>. The higher your score, the more confident banks are that you will repay. Your score determines whether your loan application is approved, and at what interest rate.</p>
</div>
<h3>Risk Grades</h3>
<p>CBS also assigns a letter grade alongside the number:</p>
<div class="stat-row">
    <div class="stat-card"><span class="stat-num" style="color:#059669">AA</span><div class="stat-label">1911–2000<br>Minimal Risk</div></div>
    <div class="stat-card"><span class="stat-num" style="color:#16a34a">BB</span><div class="stat-label">1844–1910<br>Low Risk</div></div>
    <div class="stat-card"><span class="stat-num" style="color:#ca8a04">CC–EE</span><div class="stat-label">1782–1843<br>Medium Risk</div></div>
    <div class="stat-card"><span class="stat-num" style="color:#dc2626">FF–HH</span><div class="stat-label">1000–1781<br>High Risk</div></div>
</div>
<p>Most banks want to see a score above 1844 (BB or better) for standard loan approval. A lower grade doesn't mean automatic rejection — but it usually means a higher interest rate, a lower approved amount, or stricter conditions.</p>
<div class="callout">
    <div class="callout-icon">💡</div>
    <p><strong>You can check your own score without affecting it.</strong> Go to creditbureau.com.sg or through SingPass. One free report per year; additional checks cost S$6.42. Checking your own score is a "soft enquiry" and has zero impact on your credit rating.</p>
</div>
`},
{ type:'text', content:`
<div class="page-eyebrow">Unit 1 · Lesson 1</div>
<h2>What Affects Your CBS Score?</h2>
<p>The exact CBS algorithm is proprietary, but the five main factors — weighted by their relative impact — are well documented:</p>
<h3>1. Payment History <span style="color:#dc2626;font-size:.9rem">(Most Important)</span></h3>
<p>Whether you pay on time, every time. A single missed payment — even on a small credit card balance — can drop your score significantly and stays on your CBS record for <strong>up to 3 years</strong>. Set up autopay for at least the minimum payment on every credit facility as a backstop. You never want to accidentally miss a payment.</p>
<h3>2. Credit Utilisation</h3>
<p>The percentage of your available credit limit currently in use. If your total credit card limit across all cards is S$20,000 and you have S$14,000 outstanding, your utilisation is 70% — which signals financial stress to lenders. The general guideline is to keep utilisation below 30%. Paying down balances raises your score quickly.</p>
<h3>3. Length of Credit History</h3>
<p>The longer your track record of responsible borrowing, the better. This is why closing your oldest credit card — even one you rarely use — can slightly hurt your score. Older accounts help your average credit age.</p>
<h3>4. Recent Credit Applications</h3>
<p>Every time you apply for a new loan or credit card, the lender does a "hard enquiry" on your CBS report. Multiple hard enquiries in a short period signal financial desperation to lenders and reduces your score. Avoid applying for several credit products at once.</p>
<h3>5. Types of Credit</h3>
<p>Having a healthy mix of credit types (credit card, car loan, mortgage) can positively signal credit management ability. Less important than the factors above.</p>
<div class="warning-box">
    <span class="wl">Common Mistake</span>
    <p>Applying for 3–4 credit cards at once when setting up your finances will trigger multiple hard enquiries simultaneously. Each enquiry may reduce your score by a few points. Space out new credit applications by at least 3–6 months.</p>
</div>
`},

{ type:'text', content:`
<div class="page-eyebrow">Unit 1 · Lesson 1</div>
<h2>Building and Protecting Your Score</h2>
<p>A strong CBS score is built slowly and damaged quickly. The same principles apply whether you are starting from scratch or repairing past damage.</p>
<h3>Fundamentals</h3>
<ul>
    <li><strong>Pay the full outstanding balance every month.</strong> For credit cards, always repay the full amount due — never just the minimum sum. Paying only the minimum waives the late payment fee but the remaining balance is still charged 27% interest, and all new purchases immediately attract that same interest rate. Set up autopay for the <em>full</em> outstanding amount, or at minimum as a backstop — but target zero rollover.</li>
    <li><strong>Keep utilisation below 30%.</strong> If your limit is S$5,000, keep your outstanding balance below S$1,500. If you regularly spend more, request a limit increase rather than exceeding the threshold.</li>
    <li><strong>Let old accounts age.</strong> Resist the urge to cancel cards you don't use frequently — unless there's a compelling reason. The history helps your score.</li>
    <li><strong>Space out credit applications.</strong> Particularly important before a major loan application (mortgage). Do not apply for new credit in the 6–12 months before you plan to buy a flat.</li>
</ul>
<h3>Disputing Errors</h3>
<p>Errors on CBS reports are more common than people realise — an account showing as unpaid when it was settled, a hard enquiry from a lender you never approached. Review your report annually. Dispute any inaccuracies directly with CBS; they have a formal dispute process. An error could be costing you a better rate without your knowledge.</p>
<div class="example-box">
    <span class="ex-label">Real Impact</span>
    <p>A CBS score of 1900 (AA) vs 1750 (FF) on a S$500,000 mortgage over 25 years could mean a difference of 0.5–1.0% in interest rate — which translates to roughly S$40,000–80,000 in additional total interest paid over the loan tenure. Your credit score has a direct dollar value.</p>
</div>
`}
]

pages:[
{ type:'text', content:`
<div class="page-eyebrow">Unit 1 · Lesson 2</div>
<h2>Flat Rate vs Effective Interest Rate</h2>
<p>When a bank advertises a personal loan or car loan, they typically quote a <strong>flat rate</strong>. It sounds straightforward, but it systematically understates the true cost of borrowing.</p>
<div class="key-term">
    <span class="kt-label">Definition</span>
    <span class="kt-term">Flat Rate</span>
    <p>Interest calculated on the <em>original full loan amount</em> for the entire loan period — even as you progressively pay back the principal month by month. This makes the rate appear lower than it actually is.</p>
</div>
<div class="key-term">
    <span class="kt-label">Definition</span>
    <span class="kt-term">Effective Interest Rate (EIR)</span>
    <p>The true annual cost of borrowing, accounting for the declining outstanding balance as you make monthly repayments. This is the real rate you should use to compare loan products. MAS requires all lenders in Singapore to disclose EIR — always find this number before signing.</p>
</div>
<h3>Why the Difference Matters</h3>
<p>For a typical monthly repayment loan, <strong>EIR is roughly 1.8–2× the flat rate</strong>. A loan advertised at "3% flat" actually costs closer to 5.5% EIR. The gap exists because the flat rate ignores that your outstanding balance shrinks every month — yet you are still charged interest on the original full amount.</p>
<div class="example-box">
    <span class="ex-label">Worked Example</span>
    <p><strong>S$50,000 car loan · 2.5% flat · 5 years (60 months)</strong><br><br>
    Total interest at flat rate: S$50,000 × 2.5% × 5 = <strong>S$6,250</strong><br>
    Monthly repayment: (S$50,000 + S$6,250) ÷ 60 = <strong>S$938/month</strong><br><br>
    But by month 30, you have repaid ~S$25,000 — yet the bank is still charging interest on the full S$50,000.<br><br>
    True EIR ≈ <strong>4.7%</strong> — nearly double what was advertised.</p>
</div>
<p>This rule applies to personal loans and car loans in Singapore. For mortgages, banks typically quote the actual annual rate directly (since mortgages reprice regularly). Always verify by looking at the loan offer's fine print for the EIR disclosure.</p>
`},

desc:'BNPL services have transformed how Singapore spends. What most users don\'t know about how these products work — and what they risk.',
pages:[
{ type:'text', content:`
<div class="page-eyebrow">Unit 1 · Lesson 3</div>
<h2>How BNPL Works in Singapore</h2>
<p>Buy Now, Pay Later services — <strong>Atome, Grab PayLater, ShopBack Pay Later, Pace</strong> — allow you to split purchases into 3–4 equal instalments, typically over 6–12 weeks, at zero interest if you pay on time.</p>
<p>On the surface, this looks like free credit. A S$300 purchase becomes three S$100 payments — the first at checkout, the rest over the following weeks. For budgeting purposes, spreading a large expense feels more manageable.</p>
<h3>How They Make Money</h3>
<p>BNPL providers are not charities. Their revenue model has two components:</p>
<ul>
    <li><strong>Merchant fees:</strong> Retailers pay the BNPL provider 2–6% of each transaction for access to the customer base and the psychological frictionlessness that increases conversion and average order value.</li>
    <li><strong>Late fees:</strong> Typically 3–8% of the instalment amount per missed payment. If you miss a S$100 instalment on Atome, you may pay a S$3–8 fee immediately — and the balance does not go away.</li>
</ul>
<div class="key-term">
    <span class="kt-label">Key Mechanism</span>
    <span class="kt-term">The Purchase Threshold Effect</span>
    <p>Traditional credit asks: "Can I afford S$300?" BNPL reframes the question to: "Can I afford S$100 this week?" The lower psychological threshold causes users to make purchases they would not otherwise have made. Research consistently shows BNPL users spend 20–45% more than cash users on comparable purchases.</p>
</div>
`},
{ type:'text', content:`
<div class="page-eyebrow">Unit 1 · Lesson 3</div>
<h2>The Risks You Need to Know</h2>
<h3>1. CBS Credit Score Impact</h3>
<p>Since 2024, larger BNPL providers in Singapore are required to report significant defaults and delinquencies to the Credit Bureau Singapore. A missed payment that goes unresolved for an extended period can now appear on your CBS report — affecting your mortgage application years later.</p>
<h3>2. Invisible Stacking</h3>
<p>Because BNPL plans feel small, it is easy to accumulate multiple active plans simultaneously. Four BNPL plans totalling S$1,200 in deferred payments is a real liability — but it does not appear in your regular banking app, and there is no consolidated view across providers.</p>
<h3>3. Cash Flow Disruption</h3>
<p>BNPL creates fixed future payment obligations that auto-debit from your account. If your salary is delayed or an unexpected expense hits, the auto-debit may fail — triggering late fees and potentially triggering cascade failures across multiple plans.</p>
<div class="warning-box">
    <span class="wl">MAS Guidance</span>
    <p>The Monetary Authority of Singapore classifies many BNPL products as falling outside traditional credit regulation, which means they carry fewer consumer protections than credit cards. There is no mandatory cooling-off period, and dispute resolution processes vary significantly between providers. Read the terms of each service carefully before enrolling.</p>
</div>
<h3>When Is BNPL Reasonable?</h3>
<p>BNPL is not inherently harmful. It is reasonable when: (1) you would have made the purchase anyway with cash, (2) you have confirmed the repayment dates align with your cash flow, and (3) you are using it to manage timing rather than to afford something you cannot actually pay for. It becomes a problem when it is used as a substitute for savings or to purchase things that stretch your budget.</p>
`},

    question:'You have four active BNPL plans totalling S$800 in upcoming instalments this month. You miss one S$80 payment. What is the most likely outcome?',
    options:[
        'Nothing — BNPL missed payments have no consequences in Singapore',
        'The BNPL provider immediately reports you to CBS and you are blacklisted',
        'You are charged a late fee, the amount remains due, and persistent default may now affect your CBS report',
        'The plan is automatically cancelled and remaining instalments are waived'

{
id:4,
title:'Managing Debt: What To Do',
subtitle:'Consolidation plans, credit counselling, and the debt warning signs',
desc:'What happens when debt spirals out of control — and the MAS-backed schemes Singapore has built to help you recover without destroying your future.',
pages:[
{ type:'text', content:`
<h2>Are You In Trouble?</h2>
<p>Debt itself is not the problem — unmanageable debt is. The difference is whether your repayments leave you with enough to live on, save, and absorb a financial shock. Most people in serious debt difficulty got there gradually, not overnight.</p>
<h3>Warning Signs</h3>
<ul>
    <li>You consistently pay only the <strong>minimum sum</strong> on your credit card</li>
    <li>You use one credit card to pay off another</li>
    <li>You have taken a personal loan to cover everyday expenses</li>
    <li>More than <strong>35–40% of your take-home pay</strong> goes to debt repayments</li>
    <li>You avoid checking your bank balance or opening credit card statements</li>
</ul>
<div class="key-term">
    <span class="kt-label">Key Term</span>
    <span class="kt-term">Total Debt Servicing Ratio (TDSR)</span>
    <p>MAS rules say banks cannot approve a loan if your total monthly debt repayments — including the new loan — exceed <strong>55% of your gross monthly income</strong>. If a lender is rejecting you, you've likely hit TDSR. This is also a useful personal guardrail: if you're above 40%, your finances are under real strain.</p>
</div>
<h3>Types of Unsecured Debt by Cost</h3>
<div class="stat-row">
    <div class="stat-card"><span class="stat-num" style="color:#dc2626;font-size:1.5rem">26.9%</span><div class="stat-label">Credit card EIR<br>(industry standard)</div></div>
    <div class="stat-card"><span class="stat-num" style="color:#d97706;font-size:1.5rem">3–8%</span><div class="stat-label">Personal loan EIR<br>(bank)</div></div>
    <div class="stat-card"><span class="stat-num" style="color:#059669;font-size:1.5rem">4%</span><div class="stat-label">Licensed moneylender<br>max monthly rate</div></div>
</div>
<div class="warning-box">
    <span class="wl">Never Borrow from Loan Sharks</span>
    <p>Illegal moneylenders (loan sharks) charge astronomical rates and use harassment and intimidation to collect. There is no legal protection for debts with unlicensed lenders. If approached, report to SPF at 1800-924-5664 or X-Ah Long hotline 1800-924-5664. Singapore has licensed moneylenders under the Ministry of Law — always verify on MinLaw's list first.</p>
</div>
`},
{ type:'text', content:`
<h2>Your Recovery Options</h2>
<p>Singapore has a structured set of official channels for debt recovery. Using them does not make you a failure — it makes you someone who found a way out.</p>
<h3>Option 1: Debt Consolidation Plan (DCP)</h3>
<p>A MAS-mandated industry scheme where all your unsecured credit debts from multiple banks are consolidated into a <strong>single loan at a significantly lower interest rate</strong>. Administered by participating banks (DBS, POSB, UOB, OCBC, etc.).</p>
<div class="example-box">
    <span class="ex-label">Example</span>
    <p>You have S$25,000 in credit card debt across 3 banks at 26.9% EIR. Under DCP, this is consolidated at roughly <strong>7–9% EIR</strong> into a single monthly payment over 3–10 years. You must close all but one credit card during the repayment period. Eligibility: annual income S$20,000–S$120,000 and total unsecured debt exceeding 12× monthly income.</p>
</div>
<h3>Option 2: Credit Counselling Singapore (CCS)</h3>
<p>A non-profit organisation that provides <strong>free financial counselling</strong> and negotiates with creditors on your behalf. Their Debt Management Programme (DMP) sets up a structured repayment plan — often with reduced or waived interest — that you can realistically stick to. Suitable for those with steady income but overwhelmed by multiple debts. Visit ccs.org.sg.</p>
<h3>Option 3: Debt Repayment Scheme (DRS)</h3>
<p>A court-administered scheme for people with <strong>unsecured debts of S$150,000 or less</strong>. It is an alternative to bankruptcy — a structured repayment plan over up to 5 years, supervised by an Official Assignee. Your assets are not seized. You avoid the severe restrictions of bankruptcy but your spending is monitored.</p>
<h3>Option 4: Bankruptcy</h3>
<p>Last resort. If you owe more than S$15,000 and cannot repay, creditors can apply to court to declare you bankrupt. Consequences include restrictions on travel, holding directorships, and certain professions. Discharged after meeting repayment targets. MoneySense strongly advises exhausting DCP, CCS and DRS before this point.</p>
<div class="callout">
    <div class="callout-icon">💡</div>
    <p>The <strong>MoneySense financial calculator</strong> at moneysense.gov.sg helps you calculate exactly how long it takes to pay off any outstanding debt at the current minimum payment — and shows the dramatic effect of paying even slightly more each month.</p>
</div>
`},
{ type:'quiz',
    question:'You have S$30,000 in credit card debt spread across four banks, all charging 26.9% EIR. Which MAS-mandated scheme allows you to consolidate this into a single loan at a much lower interest rate?',
    options:[
        'Debt Repayment Scheme (DRS)',
        'Debt Consolidation Plan (DCP)',
        'Credit Counselling Singapore (CCS)',
        'Mortgage Servicing Ratio (MSR) waiver'
    ],
    answer:1,
    explanation:'The Debt Consolidation Plan (DCP) is the MAS-mandated industry scheme specifically designed to consolidate multiple unsecured credit debts from different banks into a single loan at a lower interest rate (roughly 7–9% EIR vs 26.9%). CCS is a counselling organisation, DRS is a court scheme for debts under S$150,000, and MSR is a property loan metric — none of these consolidate debt across banks.'
}
]
}
]

{ type:'text', content:`
<div class="page-eyebrow">Unit 2 · Lesson 1</div>
<h2>Public vs Private Housing</h2>
<p>Singapore operates a dual housing market: a heavily subsidised <strong>public housing system</strong> managed by the Housing & Development Board (HDB), and a market-priced <strong>private property sector</strong>. Roughly 80% of Singapore residents live in HDB flats.</p>
<h3>HDB Housing</h3>
<ul>
    <li><strong>BTO (Build-To-Order):</strong> New flats purchased directly from HDB before construction. Heavily subsidised — the primary route for first-time buyers. 3–5 year wait from application to key collection. Subject to strict eligibility rules.</li>
    <li><strong>Resale HDB:</strong> Existing flats transacted on the open market between individuals. No wait time; higher prices than BTO; more location flexibility. Eligible for CPF Housing Grant if conditions are met.</li>
    <li><strong>Executive Condominium (EC):</strong> A hybrid product developed privately but subject to HDB rules for the first 10 years. After 10 years, fully privatised. Income ceiling applies (S$16,000/month as at 2024). EC prices sit between HDB and private condominiums.</li>
</ul>
<h3>Private Property</h3>
<ul>
    <li><strong>Condominiums:</strong> Strata-titled private residential units with facilities. No income ceiling. Available to Singapore Citizens, PRs, and foreigners (with ABSD).</li>
    <li><strong>Landed property:</strong> Terrace houses, semi-detached, bungalows. Restricted — foreigners typically cannot purchase without approval from the Singapore Land Authority.</li>
</ul>
<div class="key-term">
    <span class="kt-label">Regulatory Framework</span>
    <span class="kt-term">MSR and TDSR</span>
    <p><strong>Mortgage Servicing Ratio (MSR):</strong> For HDB flats and ECs, your monthly mortgage repayment cannot exceed 30% of gross monthly income.<br><br>
    <strong>Total Debt Servicing Ratio (TDSR):</strong> For all property loans, your total monthly debt repayments (all loans combined) cannot exceed 55% of gross monthly income. These are MAS-mandated caps, not bank guidelines — they cannot be waived.</p>
</div>
`},
{ type:'text', content:`
<div class="page-eyebrow">Unit 2 · Lesson 1</div>
<h2>Eligibility — Who Can Buy What</h2>
<p>Singapore's housing market is tightly regulated by citizenship, income, family status, and existing property ownership. Before viewing a single flat, confirm your eligibility.</p>
<h3>HDB BTO Eligibility (core requirements)</h3>
<ul>
    <li>At least <strong>one applicant must be a Singapore Citizen</strong> (Singapore PRs can only apply for 2-room Flexi flats in non-mature estates; they cannot apply for most BTO flat types)</li>
    <li>You must form a <strong>family nucleus</strong> (married couple, parents + children, or fiancé/fiancée scheme)</li>
    <li>Monthly household income ≤ <strong>S$14,000</strong> (for 4-room and larger; lower for 3-room)</li>
    <li>You must <strong>not own any other property</strong> (local or overseas)</li>
    <li>Subject to HDB's <strong>Ethnic Integration Policy</strong> quotas per block</li>
</ul>
<h3>Resale HDB Eligibility</h3>
<p>More flexible than BTO. Singles (≥35 years old) can buy resale flats. PRs can buy resale HDB flats after 3 years of PR status. Income ceiling does not apply unless claiming CPF Housing Grants.</p>
<h3>CPF Housing Grants</h3>
<p>For eligible buyers, CPF Housing Grants reduce the effective purchase price significantly:</p>
<ul>
    <li><strong>Enhanced CPF Housing Grant (EHG):</strong> Up to S$120,000 for BTO; up to S$60,000 for resale. Income-based, tiered grant — the lower your income, the higher the grant.</li>
    <li><strong>Family Grant:</strong> Up to S$50,000 for resale flats. For first-timer families.</li>
    <li><strong>Proximity Housing Grant (PHG):</strong> Up to S$30,000 for buying within 4km of parents/children.</li>
</ul>
<div class="callout">
    <div class="callout-icon">⚡</div>
    <p><strong>Ownership history matters:</strong> If you have previously received a housing subsidy, your second property is subject to a <strong>Resale Levy</strong> — a clawback mechanism ensuring subsidies flow to first-time buyers. The levy ranges from S$15,000 to S$55,000 depending on the flat type previously subsidised. Plan your housing journey with this in mind from the start.</p>
</div>
`},

<div class="page-eyebrow">Unit 2 · Lesson 2</div>
<h2>The HDB Concessionary Loan</h2>
<p>The HDB loan is available only to eligible buyers of HDB flats (not private property). It is provided directly by HDB, not a commercial bank.</p>
<table class="comp-table">

        <tr><td>Down Payment</td><td class="val-hdb">20% — can be fully paid with CPF OA</td></tr>
        <tr><td>Cash Required</td><td class="val-hdb" style="color:#059669"><strong>S$0 cash</strong> — if CPF OA is sufficient</td></tr>
        <tr><td>Prepayment Penalty</td><td class="val-hdb">None — repay extra anytime</td></tr>

        <tr><td>Switching</td><td>Can refinance to bank loan at any time. <strong>Cannot switch back to HDB loan.</strong></td></tr>
    </tbody>
</table>
<div class="callout">
    <div class="callout-icon">💡</div>
    <p>The HDB loan rate tracks the CPF Ordinary Account rate (currently 2.5%) plus 0.1%. This rate is set by the government and has remained at 2.6% for many years. It provides <strong>certainty</strong> — you always know exactly what you will pay each month, for the entire loan tenure.</p>

{ type:'text', content:`
<div class="page-eyebrow">Unit 2 · Lesson 2</div>
<h2>The Bank Loan</h2>
<p>Bank loans are available from all major Singapore banks (DBS, OCBC, UOB, Standard Chartered, etc.) and can finance both HDB flats and private property.</p>

pages:[
{ type:'text', content:`
<div class="page-eyebrow">Unit 2 · Lesson 3</div>
<h2>Buyer's Stamp Duty (BSD)</h2>
<p>BSD is a tax levied on all property purchases in Singapore — paid by the buyer on top of the purchase price. It is tiered based on the purchase price and is due within 14 days of signing the Option to Purchase.</p>
<table class="comp-table">
    <thead><tr><th>Purchase Price Band</th><th>BSD Rate</th></tr></thead>
    <tbody>
        <tr><td>First S$180,000</td><td>1%</td></tr>
        <tr><td>Next S$180,000 (S$180,001–S$360,000)</td><td>2%</td></tr>
        <tr><td>Next S$640,000 (S$360,001–S$1,000,000)</td><td>3%</td></tr>
        <tr><td>Next S$500,000 (S$1,000,001–S$1,500,000)</td><td>4%</td></tr>
        <tr><td>Above S$1,500,000</td><td>5%</td></tr>
    </tbody>
</table>
<div class="example-box">
    <span class="ex-label">BSD Calculation: S$550,000 HDB Resale Flat</span>
    <p>
    S$180,000 × 1% = <strong>S$1,800</strong><br>
    S$180,000 × 2% = <strong>S$3,600</strong><br>
    S$190,000 × 3% = <strong>S$5,700</strong><br>
    <strong>Total BSD: S$11,100</strong>
    </p>
</div>
<div class="key-term">
    <span class="kt-label">Additional Tax</span>
    <span class="kt-term">Additional Buyer's Stamp Duty (ABSD)</span>
    <p>ABSD is levied on top of BSD for certain buyers. Rates effective April 2023:<br><br>
    • Singapore Citizen, 1st property: <strong>0%</strong><br>
    • Singapore Citizen, 2nd property: <strong>20%</strong><br>
    • Singapore Citizen, 3rd+ property: <strong>30%</strong><br>
    • Singapore PR, 1st property: <strong>5%</strong><br>
    • Singapore PR, 2nd property: <strong>30%</strong><br>
    • Foreigners (any property): <strong>60%</strong></p>
</div>
<p>On a S$1,500,000 condo, a foreigner would pay 60% ABSD = <strong>S$900,000</strong> in stamp duty alone. This is the government's most direct tool to cool foreign demand and speculative buying.</p>
`},
{ type:'text', content:`
<div class="page-eyebrow">Unit 2 · Lesson 3</div>
<h2>The Other Costs Nobody Quotes You</h2>
<p>Before making an offer on any property, build a complete cost model. The purchase price is not the total cost.</p>
<h3>Transaction Costs</h3>
<ul>
    <li><strong>Legal / conveyancing fees:</strong> S$2,000–S$3,500 for a standard HDB resale transaction; S$3,000–S$5,000+ for private property. Covers the solicitor who handles title transfer and loan documentation.</li>
    <li><strong>Valuation report:</strong> S$300–S$500. Required by HDB and most banks to confirm the property's market value before approving a loan.</li>
    <li><strong>Agent commission (seller pays):</strong> Typically 1–2% of purchase price. Buyer typically pays nothing — but confirm this upfront.</li>
</ul>
<h3>Ongoing and Irregular Costs</h3>
<ul>
    <li><strong>Property tax (annual):</strong> Owner-occupied rates are significantly lower than non-owner-occupied. A S$550,000 flat in owner-occupier status: approximately S$1,000–S$1,400/year in property tax.</li>
    <li><strong>HDB service and conservancy charges:</strong> S$20–S$90/month depending on flat type and town council. Covers lift maintenance, cleaning, estate management.</li>
    <li><strong>Fire insurance:</strong> Mandatory for HDB flats under mortgage — approximately S$1.50 per S$1,000 of loan per year.</li>
    <li><strong>Home contents insurance:</strong> Optional but strongly recommended. S$150–S$400/year for comprehensive coverage.</li>
    <li><strong>Renovation:</strong> Budget S$30,000–S$80,000 for a standard 4-room HDB resale renovation. New BTOs often need S$30,000–S$50,000. Renovation is a significant cash outflow that many first-time buyers underestimate.</li>
</ul>
<div class="warning-box">
    <span class="wl">Planning Rule of Thumb</span>
    <p>For a S$550,000 HDB resale flat: BSD (~S$11,100) + legal fees (~S$3,000) + valuation (~S$400) + renovation (~S$50,000) + first year charges = <strong>approximately S$65,000–80,000 in costs on top of the down payment</strong>. A CPF OA balance that covers the down payment may leave you cash-poor for renovation. Plan for this gap well in advance.</p>
</div>
`},

{ type:'text', content:`
<div class="page-eyebrow">Unit 3 · Lesson 1</div>
<h2>What Life Insurance Actually Is</h2>
<p>Life insurance is not about protecting yourself — you will not be alive to benefit from it. It is about protecting the <strong>people who depend on your income</strong>. If you die, a lump sum or regular income is paid to your chosen beneficiaries, enabling them to continue their lives without the financial catastrophe your death would otherwise cause.</p>
<div class="key-term">
    <span class="kt-label">The Core Question</span>
    <span class="kt-term">Who Would Suffer Financially If You Died Tomorrow?</span>
    <p>If your honest answer is "nobody" — a single person with no dependants and no significant debts — you may not need life insurance right now. If your answer includes a spouse, children, aging parents who depend on your financial support, or a mortgage your partner could not service alone — you need it, and likely more than you think.</p>
</div>
<h3>Key Terms</h3>
<ul>
    <li><strong>Sum Assured:</strong> The death benefit — the lump sum paid to your beneficiaries on your death or total permanent disability.</li>
    <li><strong>Premium:</strong> What you pay to maintain the policy. Can be monthly or annual.</li>
    <li><strong>Beneficiary:</strong> The person(s) who receive the payout. You name them when you buy the policy. Can be changed.</li>
    <li><strong>Total Permanent Disability (TPD):</strong> Most life policies also pay out on TPD — typically defined as being unable to engage in any occupation for life. This is not the same as temporary disability.</li>
    <li><strong>Nomination:</strong> For your policy to bypass probate and pay beneficiaries quickly, you must formally nominate them under the Insurance Act. Without a valid nomination, the sum assured forms part of your estate and may be delayed significantly.</li>
</ul>
`},

<h2>Life Insurance vs MediShield Life vs CareShield Life</h2>

{ type:'text', content:`
<div class="page-eyebrow">Unit 3 · Lesson 2</div>
<h2>Term Life Insurance — Pure Protection</h2>
<p>Term insurance provides a death benefit for a defined period — 10, 20, 30 years, or until a set age. If you die within the term, your beneficiaries receive the sum assured. If you outlive the term, the policy expires and you receive nothing back.</p>
<p>This "nothing back" feature makes term insurance feel expensive to many people — but it is precisely what makes it the most efficient protection per dollar spent.</p>
<div class="key-term">
    <span class="kt-label">Why Term Wins on Pure Protection</span>
    <span class="kt-term">The Math of Premiums</span>
    <p>A 30-year-old male, non-smoker, buying S$1,000,000 sum assured for 30 years: approximately <strong>S$55–90/month</strong> in term premiums. The equivalent whole life policy with S$1,000,000 coverage: <strong>S$400–700/month</strong> or more. The term plan delivers the same death benefit for a fraction of the cost during the years you most need protection — when your children are young and your mortgage is large.</p>
</div>
<h3>"Buy Term, Invest the Difference"</h3>
<p>This is the most cited advice in Singapore financial planning communities, and for most people with straightforward protection needs, it holds. Buy term for the insurance need. Take the S$300–500/month saved versus whole life and invest it in a low-cost index fund or SRS account. Over 30 years, that invested difference can build a nest egg that makes you self-insured by the time the term expires.</p>
<h3>Key Considerations for Term</h3>
<ul>
    <li>Buy enough coverage: sum assured should cover your full protection need (see Lesson 3), not the minimum that feels affordable</li>
    <li>Lock in the rate while you are young and healthy — premiums are guaranteed level for the term period</li>
    <li>Consider renewability: some term plans allow renewal without medical underwriting at expiry (at higher premiums)</li>
    <li>Singapore has term plans available on LIA-accredited comparison platforms like comparefirst.sg</li>
</ul>
`},
{ type:'text', content:`
<div class="page-eyebrow">Unit 3 · Lesson 2</div>
<h2>Whole Life Insurance</h2>
<p>Whole life insurance provides coverage for your entire life (typically to age 99 or 120) and accumulates a <strong>cash value</strong> component over time. You can surrender the policy and receive this cash value, or borrow against it.</p>
<p>Whole life makes sense in specific circumstances:</p>
<ul>
    <li><strong>Estate planning:</strong> Guaranteed payout regardless of when you die — useful for leaving something to children or funding inheritance tax in jurisdictions where it applies</li>
    <li><strong>Parents covering children:</strong> Locking in coverage when a child is young and healthy at the lowest possible premium</li>
    <li><strong>Business uses:</strong> Key person insurance, partnership buy-sell agreements</li>
</ul>
<p>For the majority of young working adults with a protection need and finite budget, whole life is likely not the right starting point. The premiums are significantly higher for the same coverage amount, and the cash value savings component typically returns 3–5% projected — which most investors can beat with a diversified portfolio.</p>
<h2 style="margin-top:48px">Investment-Linked Plans (ILPs)</h2>
<p>ILPs split your premium: one portion buys insurance units (protection), the rest is invested in your choice of sub-funds (unit trusts). They are sold as a way to combine insurance and investment in one product.</p>
<div class="warning-box">
    <span class="wl">Why ILPs Draw Criticism</span>
    <p><strong>Costs are high:</strong> Total expense ratios of 1.5–3.5% annually on the investment component, plus mortality charges, administration fees, and sales charges — compared to 0.2–0.5% for index funds.<br><br>
    <strong>Commissions are highest for ILPs:</strong> Financial advisers receive significantly larger commissions for ILP sales than for term plans. This creates a structural conflict of interest.<br><br>
    <strong>Early surrender is costly:</strong> Surrendering an ILP in the first 3–7 years can mean losing 20–50% of premiums paid due to surrender charges.<br><br>
    <strong>Returns are not guaranteed:</strong> Unlike whole life which has guaranteed + projected bonuses, ILP investment returns depend entirely on sub-fund performance.</p>
</div>
<div class="callout">
    <div class="callout-icon">💡</div>
    <p>This does not mean ILPs are always wrong — but before buying one, demand full fee disclosure. Ask the adviser to show you the total cost of the ILP vs buying a term plan + investing the difference in a comparable low-cost fund. If they cannot or will not produce this comparison, that is informative.</p>
</div>

pages:[
{ type:'text', content:`
<div class="page-eyebrow">Unit 3 · Lesson 3</div>
<h2>The Income Replacement Method</h2>
<p>The most widely used rule of thumb: <strong>9–10× your gross annual income</strong>. This rough estimate reflects the capital needed to generate an income stream that replaces your earnings indefinitely, assuming a conservative 5% investment return.</p>
<div class="example-box">
    <span class="ex-label">Example: Wei Ling, 32</span>
    <p>Annual income: S$78,000 (S$6,500/month)<br>
    Coverage estimate: S$78,000 × 10 = <strong>S$780,000</strong><br>
    Reasoning: S$780,000 invested at 5% generates S$39,000/year — approximately half her income, supplementing a spouse's income to maintain the family's lifestyle.</p>
</div>
<p>This method is a starting point. Adjust upward for:</p>
<ul>
    <li>Younger children (more years of dependency ahead)</li>
    <li>Single-income household (spouse has no fallback income)</li>
    <li>Higher mortgage balance outstanding</li>
    <li>Parents who depend on your financial support</li>
</ul>
<div class="key-term">
    <span class="kt-label">Concept</span>
    <span class="kt-term">Human Life Value (HLV)</span>
    <p>Your economic worth to your dependants — approximately the present value of your future earnings. A 30-year-old earning S$72,000/year with 35 working years remaining has a HLV of roughly S$1.2–1.8 million depending on career trajectory and discount rate. Most people are significantly underinsured relative to their HLV.</p>
</div>
`},
{ type:'text', content:`
<div class="page-eyebrow">Unit 3 · Lesson 3</div>
<h2>The DIME Method</h2>
<p>DIME provides a more precise calculation by itemising each specific financial obligation your dependants would face:</p>
<ul>
    <li><strong>D — Debts:</strong> All outstanding loans that would need to be cleared (excluding mortgage, which is calculated separately). Credit card balances, car loans, personal loans.</li>
    <li><strong>I — Income:</strong> Annual income × the number of years until your youngest child reaches financial independence (usually age 21 or 25).</li>
    <li><strong>M — Mortgage:</strong> Outstanding mortgage balance. Your family should be able to pay off the home outright.</li>
    <li><strong>E — Education:</strong> Estimated total cost of all children's education through university.</li>
</ul>
<div class="example-box">
    <span class="ex-label">Worked Example: Arjun, 34</span>
    <p>Annual income: S$90,000 | Car loan outstanding: S$25,000 | Mortgage outstanding: S$380,000 | Two children, ages 3 and 6 | Spouse earns S$48,000 (can cover basic expenses if needed)<br><br>
    <strong>D:</strong> S$25,000 (car loan)<br>
    <strong>I:</strong> S$90,000 × 18 years (until youngest child is 21) = S$1,620,000<br>
    <strong>M:</strong> S$380,000<br>
    <strong>E:</strong> S$60,000 × 2 children = S$120,000 (estimated university cost each)<br><br>
    <strong>DIME Total: S$2,145,000</strong><br><br>
    Adjust down by spouse's earning potential over those years. A reasonable coverage target: <strong>S$1,500,000 – S$2,000,000</strong>.<br><br>
    Arjun's current group insurance: S$90,000. <strong>He is underinsured by approximately S$1.5M.</strong></p>
</div>
<h3>Getting Quotes</h3>
<p>Singapore has several platforms for comparing term life quotes:</p>
<ul>
    <li><strong>comparefirst.sg</strong> — MAS-governed comparison portal for direct life insurance and investment products</li>
    <li><strong>moneysmart.sg, singsaver.com.sg</strong> — commercial comparison sites with broader options and instant quotes</li>
    <li><strong>Direct from insurer:</strong> AIA, Prudential, NTUC Income, Great Eastern, Manulife, Singlife all offer online term quote tools</li>
</ul>
<p>Always compare on an EIR-equivalent basis (total premiums paid over the term), not just monthly premium. Medical underwriting is required — disclose all health conditions accurately. Non-disclosure can invalidate a claim.</p>
`},

{

title:'Critical Illness Insurance',
subtitle:'What it is, why it\'s different from life cover, and how much you need',
desc:'Life insurance pays when you die. Critical illness insurance pays when you can\'t work — on diagnosis of cancer, stroke, or 35 other conditions. MoneySense says most working adults need both.',
pages:[
{ type:'text', content:`
<h2>What Is Critical Illness Insurance?</h2>
<p>Life insurance pays a lump sum when you <strong>die</strong>. Critical illness (CI) insurance pays a lump sum when you are <strong>diagnosed</strong> with one of 36 specified critical illnesses — whether you survive or not. The payout is yours to use however you need: medical bills, income replacement while you recover, mortgage repayments, or rehabilitation.</p>
<div class="key-term">
    <span class="kt-label">Key Term</span>
    <span class="kt-term">The 36 Critical Illnesses (LIA Singapore)</span>
    <p>The Life Insurance Association of Singapore mandates that all CI policies cover a standardised list of 36 major-stage conditions. The three most commonly claimed are <strong>cancer (&gt;50% of claims), major stroke, and heart attack</strong>. Other covered conditions include kidney failure requiring dialysis, major organ transplants, blindness, and severe burns.</p>
</div>
<h3>Early-Stage vs Major-Stage CI</h3>
<p>Standard CI policies pay only at the <strong>major (advanced) stage</strong> of illness. Many insurers now offer multi-stage CI plans that also pay at early and intermediate stages — for example, a carcinoma-in-situ (early cancer) diagnosis. Early-stage payouts are typically 25–50% of the sum assured.</p>
<h3>Multi-Pay CI Plans</h3>
<p>Standard CI pays out once and the policy ends. <strong>Multi-pay plans</strong> allow you to claim multiple times for different conditions — critical if cancer is treated and then a stroke occurs years later. These plans cost more but provide far broader protection over a lifetime.</p>
<div class="example-box">
    <span class="ex-label">Real Cost Context</span>
    <p>Cancer treatment in Singapore's private hospitals can cost <strong>S$150,000 to S$400,000+</strong> for chemotherapy, surgery, and targeted therapy over 2–3 years. During that time, most people cannot work full-time. Even with an Integrated Shield Plan covering hospitalisation, the out-of-pocket costs for drugs, specialist visits, and lost income are substantial. CI insurance is designed to cover exactly this gap.</p>
</div>
`},
{ type:'text', content:`
<h2>How Much CI Cover Do You Need?</h2>
<p>MoneySense recommends a CI sum assured of at least <strong>5× your annual income</strong> — enough to cover 3–5 years of treatment and income replacement. For a household with a mortgage, aim higher.</p>
<div class="stat-row">
    <div class="stat-card"><span class="stat-num" style="font-size:1.6rem">5×</span><div class="stat-label">Annual income<br>minimum rule</div></div>
    <div class="stat-card"><span class="stat-num" style="font-size:1.6rem;color:#059669">~3 yrs</span><div class="stat-label">Average recovery<br>period for cancer</div></div>
    <div class="stat-card"><span class="stat-num" style="font-size:1.3rem;color:#d97706">S$200k+</span><div class="stat-label">Typical private<br>cancer treatment</div></div>
</div>
<h3>CI vs Life Insurance: They Are Not the Same</h3>
<p>A common mistake is assuming that buying a large life insurance policy makes CI unnecessary. It does not. Life insurance only pays if you <strong>die</strong>. The financial crisis from a serious illness — where you survive but cannot work for years — is precisely the scenario life insurance does not cover. You need both.</p>
<h3>Standalone Term CI vs Bundled Products</h3>
<p>CI can be bought as a <strong>standalone term plan</strong> (pure protection, fixed premiums, no investment component) or as a rider attached to a whole life or ILP policy. MoneySense generally recommends standalone term CI for most people because premiums are transparent and significantly lower — the same S$200,000 CI coverage that costs S$80–120/month as a standalone term plan may cost S$300–500/month bundled into a whole life policy.</p>
<div class="callout">
    <div class="callout-icon">💡</div>
    <p><strong>Buy early.</strong> A 25-year-old with no health conditions can lock in CI premiums that are 3–4× cheaper than the same policy at age 40. Pre-existing conditions can lead to exclusions or loading. The cheapest time to get CI coverage is when you are young and healthy.</p>
</div>
`},

title:'MediShield Life & Integrated Shield Plans',
subtitle:'From MediShield Life to private hospital coverage — what you\'re actually paying for',
desc:'Every Singapore resident has MediShield Life. But most don\'t understand what it actually covers — or when they need to upgrade to an Integrated Shield Plan.',
pages:[
{ type:'text', content:`
<h2>MediShield Life — Your Baseline</h2>
<p><strong>MediShield Life</strong> is a mandatory basic health insurance scheme administered by CPF Board. Every Singapore Citizen and Permanent Resident is automatically enrolled. Premiums are deducted from your Medisave account, so you may never have noticed paying for it.</p>
<div class="key-term">
    <span class="kt-label">What MediShield Life Covers</span>
    <span class="kt-term">Restructured Government Hospitals — B2 and C Wards Only</span>
    <p>MediShield Life covers large hospitalisation bills at <strong>Class B2 or C wards</strong> in public restructured hospitals (SGH, NUH, TTSH, CGH, etc.). It does not cover Class A wards, B1 wards, or private hospitals. It also does not cover outpatient treatment, dental, or GP visits.</p>
</div>
<h3>How the Cost-Sharing Works</h3>
<p>MediShield Life is not full coverage — it uses a cost-sharing structure to keep premiums affordable:</p>
<ul>
    <li><strong>Deductible:</strong> The first S$2,000–S$3,500/year you pay out-of-pocket before MediShield Life kicks in (amount varies by age)</li>
    <li><strong>Co-insurance:</strong> After the deductible, you pay 10% of the claimable bill, MediShield Life covers 90%</li>
    <li><strong>Annual claim limit:</strong> S$150,000 per year (sufficient for most B2-ward treatments)</li>
</ul>
<div class="example-box">
    <span class="ex-label">Example: Knee Replacement in B2 Ward, Bill = S$18,000</span>
    <p>Deductible: S$2,000 (you pay). Claimable amount: S$16,000. Co-insurance: S$1,600 (10%). MediShield Life pays: S$14,400. <strong>Your total out-of-pocket: S$3,600</strong>. For a B2 ward procedure, this is well-managed. Now imagine the same surgery in a private hospital at S$60,000 — MediShield Life's B2 claim limits would leave you with a far larger gap.</p>
</div>
`},
{ type:'text', content:`
<h2>Integrated Shield Plans — The Upgrade</h2>
<p>An <strong>Integrated Shield Plan (ISP)</strong> is a private insurance plan that sits on top of MediShield Life. It extends your coverage to Class A wards, Class B1 wards, or private hospitals — depending on which tier you buy. ISPs are offered by six private insurers approved by MOH: AIA, Great Eastern, Prudential, NTUC Income, Singlife, and AXA/HSBC Life. (Verify the current list at MOH.gov.sg — providers may change.)</p>
<p>Before diving in, it helps to understand how the three layers of health coverage stack on top of each other.</p>
<div style="display:flex;flex-direction:column;gap:10px;margin:20px 0">
    <div style="display:flex;align-items:flex-start;gap:14px;background:#FEF3F0;border-radius:10px;padding:14px 16px;border:1px solid rgba(232,57,27,.1)">
        <div style="min-width:28px;height:28px;border-radius:50%;background:var(--tier);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;flex-shrink:0">1</div>
        <div>
            <div style="font-weight:700;margin-bottom:2px">MediShield Life <span style="font-weight:400;color:#6b7280;font-size:0.9rem">— The Floor</span></div>
            <div style="font-size:0.9rem;color:#444">Everyone has it automatically. Covers B2/C ward stays at public hospitals only. Premiums come out of your Medisave — most people never notice paying it.</div>
        </div>
    </div>
    <div style="display:flex;align-items:flex-start;gap:14px;background:#FEF3F0;border-radius:10px;padding:14px 16px;border:1px solid rgba(232,57,27,.1)">
        <div style="min-width:28px;height:28px;border-radius:50%;background:var(--tier);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;flex-shrink:0">2</div>
        <div>
            <div style="font-weight:700;margin-bottom:2px">ISP <span style="font-weight:400;color:#6b7280;font-size:0.9rem">— The Upgrade</span></div>
            <div style="font-size:0.9rem;color:#444">A private plan you choose to buy. Upgrades which ward class you're covered for — B1, Class A, or private hospitals. You still personally owe the deductible and co-insurance.</div>
        </div>
    </div>
    <div style="display:flex;align-items:flex-start;gap:14px;background:#FEF3F0;border-radius:10px;padding:14px 16px;border:1px solid rgba(232,57,27,.1)">
        <div style="min-width:28px;height:28px;border-radius:50%;background:var(--tier);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;flex-shrink:0">3</div>
        <div>
            <div style="font-weight:700;margin-bottom:2px">Rider <span style="font-weight:400;color:#6b7280;font-size:0.9rem">— The Top-Up</span></div>
            <div style="font-size:0.9rem;color:#444">An optional add-on to your ISP. Covers the deductible and co-insurance so your out-of-pocket is minimised. Subject to MAS co-payment rules.</div>
        </div>
    </div>
</div>
<h3>Which Ward Level Do You Want?</h3>
<table class="comp-table">
    <thead><tr><th>Plan Tier</th><th style="color:var(--tier)">Coverage</th><th style="color:var(--tier)">Approx. Annual Premium (Age 30)</th></tr></thead>
    <tbody>
        <tr><td>MediShield Life only</td><td>B2/C ward, public hospital</td><td>~S$210 (from Medisave)</td></tr>
        <tr><td>ISP — B1 tier</td><td>B1 ward, public hospital</td><td>~S$350–450 total (partly Medisave)</td></tr>
        <tr><td>ISP — Class A tier</td><td>Class A ward, public hospital</td><td>~S$500–700 total</td></tr>
        <tr><td>ISP — Private tier</td><td>Any private hospital (e.g. Mount E, Gleneagles)</td><td>~S$900–1,400 total</td></tr>
    </tbody>
</table>
<h3>ISP Riders — Covering the Deductible and Co-insurance</h3>
<p>Even with an ISP, you still face the deductible and co-insurance. A <strong>rider</strong> is an add-on that covers these costs — but MAS has tightened the rules twice to ensure you always have some financial skin in the game.</p>
<table class="comp-table">
    <thead><tr><th>Rule</th><th style="color:var(--tier)">2021–2025</th><th style="color:var(--tier)">From 1 April 2026 (new riders)</th></tr></thead>
    <tbody>
        <tr><td>Minimum IP deductible</td><td>Rider could cover it</td><td><strong>No longer covered</strong> — paid out of pocket</td></tr>
        <tr><td>Minimum co-payment</td><td>5% of claimable bill</td><td>5% of claimable bill (unchanged)</td></tr>
        <tr><td>Annual co-payment cap</td><td>S$3,000/year</td><td><strong>S$6,000/year</strong> (or more, to keep pace with rising costs)</td></tr>
        <tr><td>Cap scope</td><td>All co-payments</td><td>Co-payments only — <em>excludes</em> the minimum IP deductible</td></tr>
    </tbody>
</table>
<p style="margin-top:12px">In plain terms: from April 2026, new riders cannot shield you from the inpatient deductible at all, and your 5% co-payment exposure doubles from $3,000 to at least $6,000 per year. Riders purchased before April 2026 remain on the old terms.</p>
<div class="warning-box">
    <span class="wl">Important: Medisave Limits on ISP Premiums</span>
    <p>You can use Medisave to pay ISP premiums, but only up to the Additional Withdrawal Limit (AWL). For age 40 and below, the AWL is S$600/year. Any premium above this must be paid in cash. Check your ISP renewal notice carefully — as you age, premiums rise but Medisave limits do not keep pace.</p>
</div>
<div class="callout">
    <div class="callout-icon">💡</div>
    <p><strong>MoneySense's guidance:</strong> Choose the ward level you're actually comfortable receiving treatment in — then buy the matching ISP. Don't buy a private hospital plan if you're happy with a Class A ward at SGH. The premium difference is significant over a lifetime, and over-insuring is money that could be invested elsewhere.</p>
</div>
`},

<div class="key-term" style="margin-bottom:20px;border-left-color:#16a34a">

        <tr style="border-top:1px solid #e5e5e5"><td style="padding:8px 0 4px;font-weight:700">Total out of pocket</td><td style="padding:8px 0 4px;text-align:right;font-weight:700;color:#d97706">S$4,500</td></tr>
