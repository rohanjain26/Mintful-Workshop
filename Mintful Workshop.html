// ── Engine ──
function showView(v) {
    document.getElementById('dashboard-view').style.display  = v==='dashboard' ? 'block' : 'none';
    document.getElementById('reader-view').style.display     = v==='reader'    ? 'flex'  : 'none';
    document.getElementById('completion-view').style.display = v==='completion'? 'flex'  : 'none';
}

function buildNav(tc) {
    const el = document.getElementById('nav-items');
    el.innerHTML = '';
    tc.units.forEach(unit => {
        const div = document.createElement('div');
        div.className = 'nav-item';
        div.id = 'nav-' + unit.key;
        div.onclick = () => switchModule(unit.key);
        div.innerHTML = `
            <div class="nav-icon">${unit.icon}</div>
            <div class="nav-text">
                <span class="nav-title">${unit.title}</span>
                <span class="nav-sub">${unit.eyebrow}</span>
            </div>
        `;
        el.appendChild(div);
    });
}

function switchModule(key) {
    currentModuleKey = key;
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    const navEl = document.getElementById('nav-' + key);
    if (navEl) navEl.classList.add('active');
    const unit = curricula[currentTierKey].units.find(u => u.key === key);
    if (!unit) return;
    document.getElementById('unit-eyebrow').textContent = unit.eyebrow;
    document.getElementById('module-title-display').textContent = unit.title;
    document.getElementById('module-desc-display').textContent = unit.desc;
    buildLessonGrid(unit);
    showView('dashboard');
    document.getElementById('main-content').scrollTop = 0;
    // Close mobile sidebar overlay and scroll content into view
    document.getElementById('sidebar').classList.remove('open');
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function buildLessonGrid(unit) {
    const grid = document.getElementById('lesson-grid');
    grid.innerHTML = '';
    unit.lessons.forEach((lesson, i) => {
        const nP = lesson.pages.length;
        const nQ = lesson.pages.filter(p => p.type==='quiz').length;
        const nI = lesson.pages.filter(p => p.type==='interactive').length;
        const card = document.createElement('div');
        card.className = 'lesson-card';
        card.onclick = () => openLesson(lesson.id, unit.key);
        card.innerHTML = `
            <div class="lc-banner"></div>
            <div class="lc-body">
                <div class="lc-num">Lesson ${i + 1}</div>
                <div class="lc-title">${lesson.title}</div>
                <div class="lc-sub">${lesson.subtitle}</div>
                <div class="lc-desc">${lesson.desc}</div>
                <div class="lc-footer">
                    <div class="lc-tags">
                        <span class="lc-tag">${iconDoc} ${nP} pages</span>
                        ${nQ ? `<span class="lc-tag">${iconQ} ${nQ} quiz</span>` : ''}
                        ${nI ? `<span class="lc-tag">${iconFlask} ${nI} activity</span>` : ''}
                    </div>
                    <span class="lc-action">Start →</span>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function openLesson(id, unitKey) {
    const unit = curricula[currentTierKey].units.find(u => u.key === unitKey);
    if (!unit) return;
    const lesson = unit.lessons.find(l => l.id === id);
    if (!lesson) return;
    currentLessonData = lesson;
    currentLessonMeta = { unitKey, unitTitle: unit.title };
    currentPageIndex = 0;
    showView('reader');
    renderPage();
}

function findNextLesson() {
    const units = curricula[currentTierKey].units;
    const uIdx = units.findIndex(u => u.key === currentLessonMeta.unitKey);
    const unit = units[uIdx];
    const lIdx = unit.lessons.findIndex(l => l.id === currentLessonData.id);
    if (lIdx + 1 < unit.lessons.length) return { lesson: unit.lessons[lIdx+1], unit };
    if (uIdx + 1 < units.length) { const nu = units[uIdx+1]; return { lesson: nu.lessons[0], unit: nu }; }
    return null;
}

function openNextLesson() {
    const next = findNextLesson();
    if (next) { switchModule(next.unit.key); openLesson(next.lesson.id, next.unit.key); }
}

function closeLesson() {
    showView('dashboard');
    if (currentLessonMeta) switchModule(currentLessonMeta.unitKey);
}

function renderPage() {
    const page  = currentLessonData.pages[currentPageIndex];
    const total = currentLessonData.pages.length;
    document.getElementById('page-counter').textContent = `${currentPageIndex+1} / ${total}`;
    document.getElementById('progress-fill').style.width = ((currentPageIndex+1)/total*100) + '%';
    document.getElementById('reader-breadcrumb').innerHTML = `${currentLessonMeta.unitTitle} / <strong>${currentLessonData.title}</strong>`;
    const content = document.getElementById('reader-content');
    const nextBtn = document.getElementById('next-btn');
    nextBtn.disabled = false;
    nextBtn.innerHTML = currentPageIndex < total-1 ? 'Continue <span>→</span>' : 'Complete Lesson ✓';
    content.scrollTop = 0;

    if (page.type === 'text') {
        content.innerHTML = `<div class="prose-page">${page.content}</div>`;
    } else if (page.type === 'quiz') {
        quizAnswered = false;
        content.innerHTML = `
            <div class="quiz-wrap">
                <div class="quiz-step">QUIZ · Question ${currentPageIndex+1} of ${total}</div>
                <div class="quiz-q">${page.question}</div>
                <div class="options-grid">
                    ${page.options.map((opt,i)=>`
                        <button class="option-btn" onclick="checkAnswer(${i},${page.answer})">
                            <span class="option-letter">${['A','B','C','D'][i]}</span>
                            <span class="option-text">${opt}</span>
                        </button>
                    `).join('')}
                </div>
                <div class="feedback-panel" id="feedback-panel"></div>
            </div>
        `;
        nextBtn.disabled = true;
    } else if (page.type === 'interactive') {
        content.innerHTML = `<div class="activity-wrap">${page.content}</div>`;
    }
}

function checkAnswer(selected, correct) {
    if (quizAnswered) return;
    quizAnswered = true;
    const isCorrect = selected === correct;
    const opts = document.querySelectorAll('.quiz-wrap .option-btn');
    opts.forEach(b => b.disabled = true);
    const page = currentLessonData.pages[currentPageIndex];
    const fb = document.getElementById('feedback-panel');
    if (isCorrect) {
        opts[selected].classList.add('correct');
        fb.className = 'feedback-panel correct-fb';
        fb.innerHTML = `<div class="feedback-head">✓ Correct!</div><div class="feedback-body">${page.explanation}</div>`;
    } else {
        opts[selected].classList.add('wrong');
        opts[correct].classList.add('correct');
        fb.className = 'feedback-panel wrong-fb';
        fb.innerHTML = `<div class="feedback-head">✗ Not quite</div><div class="feedback-body">${page.explanation}</div>`;
    }
    fb.style.display = 'block';
    document.getElementById('next-btn').disabled = false;
}

function nextPage() {
    const total = currentLessonData.pages.length;
    if (currentPageIndex < total-1) { currentPageIndex++; renderPage(); }
    else completeLesson();
}

function completeLesson() {
    buildNav(curricula[currentTierKey]);
    const next = findNextLesson();
    const nb = document.getElementById('next-lesson-btn');
    if (nb) { nb.style.display = next ? 'inline-flex' : 'none'; if (next) nb.textContent = `Next: ${next.lesson.title} →`; }
    document.getElementById('completion-title').textContent = isFirst ? 'Lesson Complete' : 'Lesson Reviewed';
    document.getElementById('completion-msg').textContent = currentLessonData.title;
    showView('completion');
}

// ── Init ──
window.addEventListener('DOMContentLoaded', () => {
    const tc = curricula[currentTierKey];
    buildNav(tc);
    switchModule(tc.units[0].key);
});
</script>
